# Optional Docker laptop setup. Demo data only. Do not publish these defaults online.
services:
  personnel-db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: personnel, POSTGRES_PASSWORD: local-personnel-only, POSTGRES_DB: personnel }
    volumes: [personnel-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U personnel]
      interval: 5s
      timeout: 3s
      retries: 20
  inventory-db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: inventory, POSTGRES_PASSWORD: local-inventory-only, POSTGRES_DB: inventory }
    volumes: [inventory-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U inventory]
      interval: 5s
      timeout: 3s
      retries: 20
  commerce-db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: commerce, POSTGRES_PASSWORD: local-commerce-only, POSTGRES_DB: commerce }
    volumes: [commerce-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U commerce]
      interval: 5s
      timeout: 3s
      retries: 20
  personnel-api:
    build: .
    environment:
      SERVICE: personnel
      SEED_DEMO: 'true'
      PERSONNEL_DATABASE_URL: postgresql+psycopg://personnel:local-personnel-only@personnel-db/personnel
      CORS_ORIGINS: http://localhost:3001
    ports: ["127.0.0.1:8001:8000"]
    depends_on: {personnel-db: {condition: service_healthy}}
  inventory-api:
    build: .
    environment:
      SERVICE: inventory
      SEED_DEMO: 'true'
      INVENTORY_DATABASE_URL: postgresql+psycopg://inventory:local-inventory-only@inventory-db/inventory
      CORS_ORIGINS: http://localhost:3002
    ports: ["127.0.0.1:8002:8000"]
    depends_on: {inventory-db: {condition: service_healthy}}
  commerce-api:
    build: .
    environment:
      SERVICE: commerce
      SEED_DEMO: 'true'
      COMMERCE_DATABASE_URL: postgresql+psycopg://commerce:local-commerce-only@commerce-db/commerce
      CORS_ORIGINS: http://localhost:3003
    ports: ["127.0.0.1:8003:8000"]
    depends_on: {commerce-db: {condition: service_healthy}}
  personnel-web:
    build: ./frontend
    environment: {ROYESH_SYSTEM: personnel, PORT: '3001', HOST: 0.0.0.0, API_URL: 'http://localhost:8001/api/v1'}
    ports: ["127.0.0.1:3001:3001"]
  inventory-web:
    build: ./frontend
    environment: {ROYESH_SYSTEM: inventory, PORT: '3002', HOST: 0.0.0.0, API_URL: 'http://localhost:8002/api/v1'}
    ports: ["127.0.0.1:3002:3002"]
  commerce-web:
    build: ./frontend
    environment: {ROYESH_SYSTEM: commerce, PORT: '3003', HOST: 0.0.0.0, API_URL: 'http://localhost:8003/api/v1'}
    ports: ["127.0.0.1:3003:3003"]
volumes:
  personnel-db:
  inventory-db:
  commerce-db:
